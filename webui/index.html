<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>ZNNext</title>
    <style>
      html[data-znn-ui='miuix'][data-znn-scheme='light'] {
        background-color: #ffffff;
      }
      html[data-znn-ui='miuix'][data-znn-scheme='dark'] {
        background-color: #242424;
      }
      html[data-znn-ui='zn'][data-znn-scheme='light'] {
        background-color: #ffffff;
      }
      html[data-znn-ui='zn'][data-znn-scheme='dark'] {
        background-color: #101014;
      }
    </style>
  </head>
  <body>
    <m3e-theme
      id="znn-theme"
      color="#6750a4"
      scheme="light"
      motion="expressive"
      density="-2"
    >
      <div id="app"></div>
    </m3e-theme>
    <script>
      (function () {
        var scheme = 'light';
        try {
          var saved = localStorage.getItem('znn_theme');
          if (saved === 'light' || saved === 'dark') {
            scheme = saved;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            scheme = 'dark';
          }
        } catch (e) {}
        var ui = 'material';
        try {
          var savedUi = localStorage.getItem('znn_ui');
          if (savedUi === 'material' || savedUi === 'miuix' || savedUi === 'zn') {
            ui = savedUi;
          }
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.znnScheme = scheme;
        root.dataset.znnUi = ui;
        root.style.colorScheme = scheme;
        if (scheme === 'dark') root.classList.add('m-theme-dark');
        var host = document.getElementById('znn-theme');
        if (host) host.setAttribute('scheme', scheme);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
