name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ v*.*.* ]
  pull_request:
  merge_group:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_BASEDIR: "${{ github.workspace }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Write key
        if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
        run: |
          if [ ! -z "${{ secrets.PRIVATE_KEY }}" ]; then
            echo '${{ secrets.PRIVATE_KEY }}' | base64 --decode > module/private_key
          fi

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
          add-to-path: true
          local-cache: ${{ github.event_name == 'push' }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: ${{ runner.os }}
          restore-keys: ${{ runner.os }}
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
          components: rust-src

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build with Gradle
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.vfs.watch=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          sed -i 's/org.gradle.unsafe.configuration-cache=true//g' gradle.properties
          ./gradlew zipRelease
          ./gradlew zipDebug

      - name: Prepare artifact
        if: success()
        id: prepareArtifact
        run: |
          releaseName=`ls module/build/outputs/release/ZNNext-v*-release.zip | awk -F '(/|.zip)' '{print $5}'` && echo "releaseName=$releaseName" >> $GITHUB_OUTPUT
          debugName=`ls module/build/outputs/release/ZNNext-v*-debug.zip | awk -F '(/|.zip)' '{print $5}'` && echo "debugName=$debugName" >> $GITHUB_OUTPUT
          7z x -y -oznn-release module/build/outputs/release/ZNNext-v*-release.zip
          7z x -y -oznn-debug module/build/outputs/release/ZNNext-v*-debug.zip

      - name: Post to channel
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.ref_type != 'tag' }}
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            OUTPUT="module/build/outputs/release"
            export Release=$(find $OUTPUT -name "ZNNext-v*-release.zip")
            export Debug=$(find $OUTPUT -name "ZNNext-v*-debug.zip")
            URL=$(python3 .github/scripts/telegram_url.py)
            curl -v "$URL" -F Release="@$Release" -F Debug="@$Debug"
          fi

      - name: Generate changelog
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq .body > "${{ runner.temp }}/changelog.md"
          cat "${{ runner.temp }}/changelog.md"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          body_path: ${{ runner.temp }}/changelog.md
          working_directory: module/build/outputs/release
          files: ${{ steps.prepareArtifact.outputs.releaseName }}.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.releaseName }}
          path: "./znn-release/*"
          compression-level: 9

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.debugName }}
          path: "./znn-debug/*"
          compression-level: 9

      - name: Sync update branch
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          versionCode=`git rev-list HEAD --count`
          releaseName="${{ steps.prepareArtifact.outputs.releaseName }}"
          zipUrl="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$releaseName.zip"
          changelogUrl="https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/update/changelog.md"

          mkdir -p "${{ runner.temp }}/update-channel"
          cp "${{ runner.temp }}/changelog.md" "${{ runner.temp }}/update-channel/changelog.md"
          cat > "${{ runner.temp }}/update-channel/update.json" <<EOF
          {
              "version": "${{ github.ref_name }}",
              "versionCode": $versionCode,
              "zipUrl": "$zipUrl",
              "changelog": "$changelogUrl"
          }
          EOF

          jsonBlob=`git hash-object -w "${{ runner.temp }}/update-channel/update.json"`
          changelogBlob=`git hash-object -w "${{ runner.temp }}/update-channel/changelog.md"`
          tree=`printf '100644 blob %s\tupdate.json\n100644 blob %s\tchangelog.md\n' "$jsonBlob" "$changelogBlob" | git mktree`

          parent=`git rev-parse --verify --quiet refs/remotes/origin/update || true`
          if [ -n "$parent" ]; then
            commit=`git commit-tree "$tree" -p "$parent" -m "docs: release ${{ github.ref_name }}"`
          else
            commit=`git commit-tree "$tree" -m "docs: release ${{ github.ref_name }}"`
          fi
          git push origin "$commit:refs/heads/update"
