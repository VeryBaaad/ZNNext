[package]
name = "injector"
version = "1.9.0"
edition = "2024"
description = "A from-scratch, standalone implementation of the Zygisk Next module."
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "help",
    "usage",
] }
libc = "0.2.191"
netlink-sys = { version = "0.9", default-features = false }
nix = { version = "0.31.3", default-features = false, features = [
    "feature",
    "fs",
    "poll",
    "process",
    "ptrace",
    "signal",
    "socket",
    "uio",
] }
object = { version = "0.39", default-features = false, features = [
    "read",
    "std",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
xattr = { version = "1.6.1", default-features = false }
machikado-rs = { git = "https://github.com/VeryBaaad/machikado-rs.git", tag = "v3.0.0" }

[target.'cfg(target_pointer_width = "64")'.dependencies]
aya = "0.14.0"

[[bin]]
name = "injector"
path = "src/main.rs"

[profile.dev]
opt-level = "s"
debug = true
strip = "symbols"
panic = "unwind"
incremental = true
overflow-checks = true
lto = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = "line-tables-only"
incremental = false
debug-assertions = false
overflow-checks = false
